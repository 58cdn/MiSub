openapi: 3.1.0
info:
  title: MiSub multi-detector API
  version: 1.5.0
  description: |
    HTTPS only. Separate from /api/ext/v1 and /api/nodes/diagnostics.
    Admin writes require the same-origin Origin header and a valid auth_session.
    Agent endpoints accept a per-detector Bearer token, never Cookie or Origin headers.
    JSON bodies are at most 1 MiB; responses are no-store. Task timestamps are Unix milliseconds;
    independent source observation timestamps use ISO 8601 UTC.
    Check categories do not imply every proxy protocol or service yields a positive verdict.
servers:
  - url: /api/probes/v1
security:
  - AdminSession: []
paths:
  /pairings/windows:
    post:
      operationId: createDetectorPairingWindow
      description: Explicitly opens a five-minute installation window and initializes pairing storage. Public IDs cannot authorize a detector. See detector-pairing-api.md for budgets and the complete native-client contract.
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody: { $ref: '#/components/requestBodies/PairingEmpty' }
      responses:
        '201': { $ref: '#/components/responses/PairingWindow' }
        default: { $ref: '#/components/responses/Error' }
  /pairings/windows/{id}:
    parameters: [{ $ref: '#/components/parameters/PairingId' }]
    get:
      operationId: detectorPairingWindowStatus
      description: Public status and at most three requests. No code, proof, token or hash is returned.
      responses:
        '200': { $ref: '#/components/responses/PairingWindow' }
        default: { $ref: '#/components/responses/Error' }
  /pairings/windows/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/PairingId' }]
    post:
      operationId: cancelDetectorPairingWindow
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      description: Cancels pending and approved requests. Consumed identities remain visible and require the existing explicit detector revocation action.
      requestBody: { $ref: '#/components/requestBodies/PairingEmpty' }
      responses:
        '200': { $ref: '#/components/responses/PairingWindow' }
        default: { $ref: '#/components/responses/Error' }
  /pairings/resolve:
    post:
      operationId: resolveDetectorPairingCode
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [windowId, userCode]
              properties:
                windowId: { $ref: '#/components/schemas/PairingId' }
                userCode: { $ref: '#/components/schemas/PairingUserCode' }
      responses:
        '200': { $ref: '#/components/responses/PairingRequest' }
        default: { $ref: '#/components/responses/Error' }
  /pairings/requests/{id}:
    parameters: [{ $ref: '#/components/parameters/PairingId' }]
    get:
      operationId: detectorPairingRequestStatus
      responses:
        '200': { $ref: '#/components/responses/PairingRequest' }
        default: { $ref: '#/components/responses/Error' }
  /pairings/requests/{id}/approve:
    parameters: [{ $ref: '#/components/parameters/PairingId' }]
    post:
      operationId: approveDetectorPairing
      description: Requires matching code and explicit confirmation. The displayed metadata and random proof fingerprint belong to this immutable request; they are not hardware attestation.
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userCode, confirmed]
              properties:
                userCode: { $ref: '#/components/schemas/PairingUserCode' }
                confirmed: { const: true }
      responses:
        '200': { $ref: '#/components/responses/PairingRequest' }
        default: { $ref: '#/components/responses/Error' }
  /device-pairing/start:
    post:
      operationId: startNativeDetectorPairing
      security: []
      description: Native HTTPS client only; Cookie, Origin and Authorization headers are forbidden. Does not initialize storage. JSON limit 8192 bytes; unknown fields and all query parameters are rejected. The window must already be open on this exact origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [windowId, name, version, platform, proofHash]
              properties:
                windowId: { $ref: '#/components/schemas/PairingId' }
                name: { type: string, minLength: 1, maxLength: 60 }
                version: { type: string, pattern: '^[A-Za-z0-9_.+-]{1,50}$' }
                platform: { type: string, pattern: '^[a-z0-9_-]{1,30}$' }
                proofHash: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the UTF-8 text of a client-generated 64-character lowercase hexadecimal proof. }
      responses:
        '201':
          description: Private device code and human comparison code returned only to the initiating native client. Never log deviceCode or proof.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - properties:
                      data:
                        type: object
                        required: [id, windowId, origin, deviceCode, userCode, fingerprint, expiresAt, intervalSeconds]
                        properties:
                          id: { $ref: '#/components/schemas/PairingId' }
                          windowId: { $ref: '#/components/schemas/PairingId' }
                          origin: { type: string, format: uri }
                          deviceCode: { type: string, pattern: '^pdc1_[0-9a-f]{64}$' }
                          userCode: { $ref: '#/components/schemas/PairingUserCode' }
                          fingerprint: { type: string, pattern: '^[0-9A-F]{4}(-[0-9A-F]{4}){3}$' }
                          expiresAt: { type: integer }
                          intervalSeconds: { const: 5 }
        default: { $ref: '#/components/responses/Error' }
  /device-pairing/token:
    post:
      operationId: redeemNativeDetectorPairing
      security: []
      description: |
        Native HTTPS client only; Cookie, Origin and Authorization are forbidden. All query parameters are rejected.
        The private deviceCode and proof are sent only in the bounded JSON body. Fixed errors never echo either.
        Wait at least the start interval before the first poll. On 429, raise the subsequent interval to at least
        max(current+5,retryAfterSeconds), bounded by expiresAt. A network failure, invalid response or server 5xx
        makes redemption uncertain; stop polling and ask the administrator to inspect and revoke the identity.
        A successful transaction consumes the pairing once and creates one origin-bound identity. A lost success
        response or local save failure requires explicit revocation and new pairing; credentials are never replayed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [windowId, id, deviceCode, proof]
              properties:
                windowId: { $ref: '#/components/schemas/PairingId' }
                id: { $ref: '#/components/schemas/PairingId' }
                deviceCode: { type: string, pattern: '^pdc1_[0-9a-f]{64}$', writeOnly: true }
                proof: { type: string, pattern: '^[0-9a-f]{64}$', writeOnly: true }
      responses:
        '200':
          description: One private config response. Atomically save to a private local file and exit; task polling starts only after the user separately starts the detector.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - properties:
                      data:
                        type: object
                        required: [status, agent, config]
                        properties:
                          status: { const: consumed }
                          agent:
                            type: object
                            required: [id, name, createdAt]
                            properties:
                              id: { type: string }
                              name: { type: string }
                              createdAt: { type: integer }
                          config:
                            type: object
                            required: [version, server, token, pollSeconds]
                            properties:
                              version: { const: 1 }
                              server: { type: string, format: uri }
                              token: { type: string, pattern: '^mp1_[0-9a-f]{64}$', description: Long-lived origin-bound token returned once to this native client. Never expose in webpage, command, package or logs. }
                              pollSeconds: { const: 60 }
        '202':
          description: data is status=pending, expiresAt (Unix milliseconds), intervalSeconds (integer). No credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }
  /capabilities:
    get:
      operationId: probeCapabilities
      responses:
        '200':
          description: Types, service IDs, sources, observationsVersion, storageReady, version, limits and installation. Installation is reviewed published-asset availability, separate from pairing protocol support. Missing or invalid metadata cannot enable installation.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          installation: { $ref: '#/components/schemas/InstallationCapabilities' }
        default: { $ref: '#/components/responses/Error' }
  /format:
    post:
      operationId: validateNodeFormats
      description: No D1 or external detector required. Never returns credentials or a connectivity verdict.
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeSelection' }
      responses:
        '200':
          description: data contains checkedAt and nodes (id, name, checks.format).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }
  /agents:
    get:
      operationId: listDetectors
      description: Legacy public array, active identities first. Hidden archived identities are excluded; response fields remain unchanged.
      responses:
        '200':
          description: Public detector records, never tokens or hashes.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Detector' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: enrollDetector
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '201':
          description: data contains id, name, createdAt and a token returned ONCE. Save privately as probe.json; never log it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }
  /agents/overview:
    get:
      operationId: detectorOverview
      description: |
        Paginated public detector summaries, default createdAt descending with id ascending as a stable tie-break.
        Hidden identities are excluded by default. Filters apply to both total and the returned page.
        Search is a literal substring of name, version or platform; percent and underscore are ordinary characters.
        ASCII letter case is ignored. Search is trimmed and limited to 80 characters without control characters.
        Query keys are whitelisted; unknown or duplicate parameters return 400.
        Sort keys are whitelisted, null/empty version and never-seen times sort last in either direction.
        Status sorting follows its string value; version sorting is lexical, not semantic version precedence.
        Status uses the server's latest claim or accepted heartbeat. Online means communication within two
        minutes, inclusive; it does not prove node connectivity or service availability. A detector with no
        valid communication timestamp has unknown status. Revocation takes precedence over communication.
        Task counts and last task/result times cover retained jobs created within the past seven days.
        Older jobs are lazily removed; expired or cancelled tasks are stopped, never received results.
        No credentials, lease capabilities or inferred detector capabilities are returned.
      parameters:
        - { $ref: '#/components/parameters/ManagementOffset' }
        - { $ref: '#/components/parameters/ManagementLimit' }
        - in: query
          name: q
          schema: { type: string, maxLength: 80, default: '' }
        - in: query
          name: status
          schema: { type: string, enum: [all, online, offline, unknown, revoked], default: all }
        - in: query
          name: visibility
          schema: { type: string, enum: [visible, hidden, all], default: visible }
        - in: query
          name: sort
          schema: { type: string, enum: [createdAt, name, status, lastSeen, lastTaskAt, lastResultAt, version], default: createdAt }
        - in: query
          name: direction
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: Public detector page and server time used for status calculation.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - properties:
                      data: { $ref: '#/components/schemas/DetectorOverviewPage' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      operationId: revokeDetector
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      description: Revokes token and cancels unfinished tasks for this detector. Does not delete original nodes.
      responses:
        '200':
          description: data.revoked is a boolean.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{id}/history:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: detectorTaskHistory
      description: |
        Persisted tasks assigned to this detector, including unfinished and stopped tasks.
        Records cover jobs created within the past seven days and remain visible after revocation or archive.
        Newest job creation time first, then task id ascending; 404 for an unknown identity.
        The creation timestamp is the job's enqueue time, not a probe execution start time.
        Completion is the server's accepted result or stop time, not an inferred provider observation time.
        checks contains only sanitized persisted evidence; no node URI, configuration, token or lease.
        An optional state filters records, total and nextOffset. The agent summary retains all task states.
      parameters:
        - { $ref: '#/components/parameters/ManagementOffset' }
        - { $ref: '#/components/parameters/ManagementLimit' }
        - in: query
          name: state
          schema: { type: string, enum: [queued, running, done, cancelled, expired] }
          description: Optional exact task state; omit for all states. Empty, unknown or duplicate values return 400 invalid_state.
      responses:
        '200':
          description: Public detector summary and task history page.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - properties:
                      data: { $ref: '#/components/schemas/DetectorHistoryPage' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: archiveDetector
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      description: |
        Reversibly hide a revoked identity from the default detector lists. Requires admin auth and exact same Origin.
        JSON is at most 256 bytes and must contain only confirmed=true; query parameters are rejected.
        A single SQL statement checks revocation and absence of a running task with lease_until greater than server time.
        Idempotent retries retain archivedAt. Re-archive after restore starts a new archivedAt transition.
        No detector, task, job or credential row is deleted. Seven-day task retention continues normally.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DetectorActionConfirmation' }
      responses:
        '200':
          description: Visibility at this atomic transition; concurrent later operations may change it.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - properties:
                      data: { $ref: '#/components/schemas/DetectorArchiveState' }
        '404': { description: agent_not_found, $ref: '#/components/responses/Error' }
        '409': { description: agent_must_be_revoked or agent_has_active_lease, $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /agents/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: restoreDetector
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      description: |
        Make a revoked identity visible again, preserving its revoked credential and all retained history.
        Requires admin auth, exact same Origin, no query and at most 256 bytes of JSON containing only confirmed=true.
        Idempotent retries preserve restoredAt. A never-archived revoked identity is a successful no-op with null timestamps.
        This never reauthorizes a detector or creates a credential.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DetectorActionConfirmation' }
      responses:
        '200':
          description: Visibility at this atomic transition; concurrent later operations may change it.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - properties:
                      data: { $ref: '#/components/schemas/DetectorArchiveState' }
        '404': { description: agent_not_found, $ref: '#/components/responses/Error' }
        '409': { description: agent_must_be_revoked, $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /jobs:
    get:
      operationId: listProbeJobs
      description: Latest 50 jobs; expires pending work and lazily removes records older than seven days.
      responses:
        '200':
          description: data array with id, created_at, expires_at, cancelled_at, types, options, total, queued, running, done, stopped.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createProbeJob
      parameters:
        - { $ref: '#/components/parameters/Origin' }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
      description: |
        Creates a snapshot task matrix (nodes x selected detectors), expires after 24 hours.
        Each detector sees only assigned tasks. A different body with the same idempotency key is rejected.
        Downloads include a worst-case budget for three attempts, at most 1 GiB per job.
        consent=true explicitly authorizes transfer of node credentials to selected detectors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/NodeSelection' }
                - type: object
                  required: [types, agentIds, consent]
                  properties:
                    consent: { const: true }
                    types: { type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: { $ref: '#/components/schemas/CheckType' } }
                    agentIds: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string } }
                    options: { $ref: '#/components/schemas/Options' }
      responses:
        '202':
          description: data.id is the job ID; data.replay indicates an idempotent retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: probeJobResults
      parameters:
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 4000, default: 0 }
      responses:
        '200':
          description: |
            data.job has public job metadata; data.nodes has at most 200 records:
            id, node_id, node_name, agent_id, agent_name, state, attempt, completed_at, checks.
            nextOffset is null at the end. No node URI, proxy configuration, token or lease.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }
  /jobs/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: cancelProbeJob
      parameters: [{ $ref: '#/components/parameters/Origin' }]
      responses:
        '200':
          description: data.cancelled=true. Finished results remain; queued/running payloads are removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }
  /agent/claim:
    post:
      operationId: claimProbeTask
      security: [{ DetectorToken: [] }]
      description: |
        At most one unexpired task lease per identity. An idle response is data=null.
        Default polling is every 60 seconds. Never copy the same identity to multiple machines.
        Only claims declaring observationsVersion=1 may receive observation tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, maxLength: 50 }
                platform: { type: string, maxLength: 30 }
                observationsVersion: { type: integer, const: 1 }
      responses:
        '200':
          description: A private task snapshot with a 90-second lease, or null.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Envelope' }
                  - properties:
                      data:
                        oneOf:
                          - { $ref: '#/components/schemas/Task' }
                          - { type: 'null' }
        default: { $ref: '#/components/responses/Error' }
  /agent/tasks/{id}/heartbeat:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: renewProbeLease
      security: [{ DetectorToken: [] }]
      description: Renew every 20 seconds. Stop execution on failure; expired/cancelled/revoked leases cannot renew.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Lease' }
      responses:
        '200':
          description: data.leaseMs=90000.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }
  /agent/tasks/{id}/result:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: completeProbeTask
      security: [{ DetectorToken: [] }]
      description: |
        Include every requested check type. Identical repeat delivery is accepted without rerunning tests.
        Unknown/passed unlock results require one entry for every requested service.
        Missing measurements are not zero. Never send raw errors, bodies or credentials.
        Observation tasks require one versioned report with every selected source, bound to the task ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/Lease' }
                - type: object
                  required: [checks]
                  properties:
                    checks: { $ref: '#/components/schemas/Checks' }
      responses:
        '200':
          description: data.accepted=true, data.replay boolean. Private task payload is removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    AdminSession: { type: apiKey, in: cookie, name: auth_session }
    DetectorToken: { type: http, scheme: bearer, bearerFormat: 'mp1_ followed by 64 lowercase hexadecimal characters' }
  parameters:
    PairingId:
      in: path
      name: id
      required: true
      schema: { $ref: '#/components/schemas/PairingId' }
    Origin:
      in: header
      name: Origin
      required: true
      schema: { type: string, format: uri }
      description: Must exactly match the MiSub HTTPS origin. Agent requests must OMIT this header.
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ManagementOffset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      description: One canonical decimal value. No sign, whitespace, leading zeroes, exponent or duplicate parameter.
    ManagementLimit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      description: One canonical decimal value. No sign, whitespace, leading zeroes, exponent or duplicate parameter.
  requestBodies:
    PairingEmpty:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false, maxProperties: 0 }
  responses:
    PairingWindow:
      description: Public installation window and safe request summaries.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - properties:
                  data: { $ref: '#/components/schemas/PairingWindow' }
    PairingRequest:
      description: Safe pairing status. Consumed means the identity was created, not that the client saved it or connected.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Envelope' }
              - properties:
                  data: { $ref: '#/components/schemas/PairingRequest' }
    Error:
      description: |
        400 invalid input/consent, 401 authentication, 403 origin/access, 404 missing resource,
        405 method, 408 body timeout, 409 lease/idempotency conflict, 413 body size,
        410 pairing expiry/cancellation, 415 content type, 429 bounded pairing budget/poll interval,
        503 missing D1 or temporary failure. No raw internal error.
      content:
        application/json:
          schema:
            type: object
            required: [success, error]
            properties:
              success: { const: false }
              error:
                type: object
                required: [code]
                properties:
                  code: { type: string }
                  retryAfterSeconds: { type: integer, minimum: 1, maximum: 3600, description: Pairing 429 only; also returned in Retry-After. }
  schemas:
    ReleaseTarget:
      type: string
      enum: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, windows-amd64]
    ReleaseAsset:
      type: object
      required: [fileName, url, sha256, size]
      properties:
        fileName: { type: string, description: Exact target binary or install.sh/install.ps1 file name. }
        url: { type: string, format: uri, description: 'Exact HTTPS github.com/58cdn/MiSub/releases/download/{tag}/{fileName} URL.' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$', description: Nonzero expected SHA256. }
        size: { type: integer, minimum: 1, maximum: 134217728 }
    PublishedProbeRelease:
      type: object
      additionalProperties: false
      required: [version, tag, sourceCommit, bootstrapProtocol, capabilities, assets, bootstrap]
      properties:
        version: { type: string, pattern: '^(0|[1-9]\d{0,5})\.(0|[1-9]\d{0,5})\.(0|[1-9]\d{0,5})$', description: Stable release; legacy 0.1.0 is not bootstrap compatible. }
        tag: { type: string, description: Exactly probe-v followed by version. }
        sourceCommit: { type: string, pattern: '^[a-f0-9]{40}$', description: Nonzero immutable wrapper revision. }
        bootstrapProtocol: { const: 1 }
        capabilities:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items: { enum: [pair, install, start, status, check-config, bootstrap-v1] }
        assets:
          type: array
          minItems: 1
          maxItems: 5
          description: Unique targets; raw executable names are misub-probe-{target}, with .exe on Windows.
          items:
            allOf:
              - { $ref: '#/components/schemas/ReleaseAsset' }
              - type: object
                required: [target]
                properties:
                  target: { $ref: '#/components/schemas/ReleaseTarget' }
        bootstrap:
          type: object
          additionalProperties: false
          description: Only shells with corresponding binary assets; script size is at most 1 MiB.
          properties:
            unix: { $ref: '#/components/schemas/ReleaseAsset' }
            windows: { $ref: '#/components/schemas/ReleaseAsset' }
    InstallationCapabilities:
      type: object
      additionalProperties: false
      required: [schemaVersion, distributionReady, release, legacyReleases, reason, targets]
      properties:
        schemaVersion: { const: 1 }
        distributionReady: { type: boolean, description: False until an audited release and its actual assets are verified. }
        release:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/PublishedProbeRelease' }
        legacyReleases:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [version, tag, capabilities]
            properties:
              version: { type: string }
              tag: { type: string }
              capabilities:
                type: array
                uniqueItems: true
                items: { enum: [pair, install, start, status, check-config, bootstrap-v1] }
                description: Legacy probe-v0.1.0 has an empty capability set.
        reason: { enum: [available, distribution_not_ready, invalid_release_catalog] }
        targets:
          type: array
          minItems: 5
          maxItems: 5
          description: Each supported target exactly once in the documented target order; missing assets remain unavailable.
          items:
            type: object
            additionalProperties: false
            required: [target, available, reason]
            properties:
              target: { $ref: '#/components/schemas/ReleaseTarget' }
              available: { type: boolean }
              reason: { enum: [available, distribution_not_ready, invalid_release_catalog, artifact_unavailable] }
    PairingId: { type: string, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }
    PairingUserCode:
      type: string
      minLength: 10
      maxLength: 11
      description: Ten Crockford Base32 characters displayed XXXXX-XXXXX; lowercase and omission of the middle hyphen accepted. Admin comparison only, never a token exchange credential.
    PairingWindow:
      type: object
      required: [id, origin, status, createdAt, expiresAt, checkedAt, requests]
      properties:
        id: { $ref: '#/components/schemas/PairingId' }
        origin: { type: string, format: uri }
        status: { enum: [open, expired, cancelled] }
        createdAt: { type: integer }
        expiresAt: { type: integer, description: At most 300 seconds after window creation. }
        checkedAt: { type: integer }
        requests: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/PairingRequest' } }
    PairingRequest:
      type: object
      required: [id, windowId, origin, name, version, platform, fingerprint, status, createdAt, expiresAt, approvedAt, consumedAt, agentId, lastSeen, checkedAt]
      properties:
        id: { $ref: '#/components/schemas/PairingId' }
        windowId: { $ref: '#/components/schemas/PairingId' }
        origin: { type: string, format: uri }
        name: { type: string }
        version: { type: string }
        platform: { type: string }
        fingerprint: { type: string, pattern: '^[0-9A-F]{4}(-[0-9A-F]{4}){3}$', description: Comparison of a client-generated random proof, not hardware attestation. }
        status: { enum: [pending, approved, consumed, expired, cancelled] }
        createdAt: { type: integer }
        expiresAt: { type: integer }
        approvedAt: { type: [integer, 'null'] }
        consumedAt: { type: [integer, 'null'] }
        agentId: { type: [string, 'null'] }
        lastSeen: { type: integer, description: Actual server claim or heartbeat time; zero before first contact. }
        checkedAt: { type: integer }
    Envelope:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data: {}
    CheckType: { type: string, enum: [format, tcp, proxy, speed, unlock, observations] }
    ObservationSource: { type: string, enum: [ipify, ip_sb, ifconfig, icanhazip, ipinfo, ippure] }
    Service: { type: string, enum: [netflix, youtube, openai, claude, gemini, disney, spotify, tiktok] }
    NodeSelection:
      type: object
      required: [scope]
      description: all/selected use persisted manual nodes; snapshot uses provided parsed node URIs. all includes disabled nodes.
      properties:
        scope: { type: string, enum: [all, selected, snapshot] }
        nodeIds: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string } }
        nodes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            required: [url]
            properties:
              id: { type: string, minLength: 1, maxLength: 128 }
              name: { type: string, maxLength: 200 }
              url: { type: string, minLength: 1, maxLength: 16384, writeOnly: true, description: Private node URI. Never log. }
      allOf:
        - if: { properties: { scope: { const: selected } } }
          then: { required: [nodeIds] }
        - if: { properties: { scope: { const: snapshot } } }
          then: { required: [nodes] }
    Options:
      type: object
      properties:
        timeoutMs: { type: integer, minimum: 1000, maximum: 15000, default: 5000 }
        downloadBytes: { type: integer, minimum: 65536, maximum: 20971520, default: 5242880 }
        allowMetered: { type: boolean, default: false, description: Must be true when speed is requested. }
        services: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, default: [netflix, youtube, openai], items: { $ref: '#/components/schemas/Service' } }
        observationsVersion: { type: integer, const: 1, description: Only used when observations is requested. }
        sources: { type: array, minItems: 1, maxItems: 6, uniqueItems: true, default: [ipify, ip_sb, ifconfig, icanhazip], items: { $ref: '#/components/schemas/ObservationSource' } }
    Detector:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: integer }
        lastSeen: { type: integer }
        revokedAt: { type: [integer, 'null'] }
        version: { type: string }
        platform: { type: string }
    DetectorOverview:
      allOf:
        - { $ref: '#/components/schemas/Detector' }
        - type: object
          required: [status, lastTaskAt, lastResultAt, taskCounts, hidden, archivedAt, lastHeartbeatAt, capabilities]
          properties:
            status:
              type: string
              enum: [online, offline, unknown, revoked]
              description: Server communication status, not node or provider health. Future or invalid lastSeen is unknown.
            lastTaskAt:
              type: [integer, 'null']
              description: Latest retained job creation time for this detector, Unix milliseconds; null if absent.
            lastResultAt:
              type: [integer, 'null']
              description: Latest retained done task's server result receipt time, including failed checks; excludes stops. Null if absent.
            hidden: { type: boolean, description: Whether a revoked identity is currently archived from default lists. }
            archivedAt: { type: [integer, 'null'], description: Latest archive transition in Unix milliseconds; retained after restore. }
            lastHeartbeatAt: { type: 'null', description: Heartbeat-only timestamps are not independently persisted. lastSeen includes claims and accepted heartbeats. }
            capabilities: { type: 'null', description: Capabilities are not persisted or inferred from version/platform. }
            taskCounts:
              type: object
              required: [queued, running, done, stopped]
              properties:
                queued: { type: integer, minimum: 0 }
                running: { type: integer, minimum: 0 }
                done: { type: integer, minimum: 0 }
                stopped: { type: integer, minimum: 0, description: Expired or cancelled tasks. }
    DetectorOverviewPage:
      type: object
      required: [agents, total, nextOffset, checkedAt, onlineWindowMs, retentionDays]
      properties:
        agents: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/DetectorOverview' } }
        total: { type: integer, minimum: 0, description: Total identities matching search/status/visibility before pagination. }
        nextOffset: { type: [integer, 'null'], minimum: 0 }
        checkedAt: { type: integer, description: Server time in Unix milliseconds. }
        onlineWindowMs: { type: integer, const: 120000 }
        retentionDays: { type: integer, const: 7 }
    DetectorActionConfirmation:
      type: object
      additionalProperties: false
      required: [confirmed]
      properties:
        confirmed: { const: true }
    DetectorArchiveState:
      type: object
      required: [id, hidden, archivedAt, restoredAt]
      properties:
        id: { type: string }
        hidden: { type: boolean }
        archivedAt: { type: [integer, 'null'] }
        restoredAt: { type: [integer, 'null'] }
    DetectorHistoryPage:
      type: object
      required: [agent, records, total, nextOffset, checkedAt, retentionDays]
      properties:
        agent: { $ref: '#/components/schemas/DetectorOverview' }
        records: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/DetectorHistoryRecord' } }
        total: { type: integer, minimum: 0, description: Total retained tasks assigned to this identity matching the optional state filter. }
        nextOffset: { type: [integer, 'null'], minimum: 0 }
        checkedAt: { type: integer, description: Server time in Unix milliseconds. }
        retentionDays: { type: integer, const: 7 }
    DetectorHistoryRecord:
      type: object
      required: [id, jobId, nodeId, nodeName, state, attempt, createdAt, completedAt, checks]
      properties:
        id: { type: string }
        jobId: { type: string }
        nodeId: { type: string }
        nodeName: { type: string }
        state: { type: string, enum: [queued, running, done, expired, cancelled] }
        attempt: { type: integer, minimum: 0, maximum: 3 }
        createdAt: { type: integer, description: Job creation time in Unix milliseconds. }
        completedAt: { type: [integer, 'null'], description: Server result receipt or stop time in Unix milliseconds; null while unfinished. }
        checks:
          oneOf:
            - { $ref: '#/components/schemas/Checks' }
            - { type: 'null' }
    Lease:
      type: object
      required: [leaseToken]
      properties:
        leaseToken: { type: string, pattern: '^[0-9a-f]{64}$', description: Private lease capability. Never log. }
    Task:
      allOf:
        - { $ref: '#/components/schemas/Lease' }
        - type: object
          required: [id, jobId, node, types, options, attempt, leaseMs]
          properties:
            id: { type: string }
            jobId: { type: string }
            node:
              type: object
              required: [id, name, proxy, format]
              properties:
                id: { type: string }
                name: { type: string }
                proxy: { type: [object, 'null'], additionalProperties: true, description: Private Mihomo proxy map; only assigned detector can retrieve this. }
                format: { $ref: '#/components/schemas/FormatCheck' }
            types: { type: array, items: { $ref: '#/components/schemas/CheckType' } }
            options:
              allOf:
                - { $ref: '#/components/schemas/Options' }
                - properties:
                    worstCaseDownloadBytes: { type: integer, minimum: 0, maximum: 1073741824 }
            attempt: { type: integer, minimum: 1, maximum: 3 }
            leaseMs: { type: integer, const: 90000 }
    Check:
      description: Shared field types. Result checks use the type-specific schemas below; unknown fields are discarded by the result endpoint. Measurements are optional and never synthesized.
      type: object
      required: [status, code]
      properties:
        status: { type: string, enum: [passed, failed, timeout, blocked, unknown, unsupported, skipped, cancelled] }
        code:
          type: string
          enum: [ok, invalid_format, unsupported_protocol, unsupported_transport, unsafe_target, dns_failed, connect_failed, tls_failed, request_failed, http_error, deadline, cancelled, prerequisite_failed, kernel_missing, kernel_failed, probe_inconclusive, region_blocked, service_reachable, native_unlocked, originals_only, rate_limited, traffic_limit, task_expired]
        latencyMs: { type: number, minimum: 0, maximum: 180000 }
        bytes: { type: integer, minimum: 0, maximum: 20971520 }
        bytesPerSecond: { type: number, minimum: 0, maximum: 1000000000000 }
        httpStatus: { type: integer, minimum: 100, maximum: 599 }
        retryAfterSeconds: { type: integer, minimum: 0, maximum: 86400, description: Only for unknown/rate_limited HTTP 429; never a successful measurement. }
        region: { type: string, pattern: '^[A-Z]{2}$' }
    FormatCheck:
      allOf:
        - { $ref: '#/components/schemas/Check' }
        - oneOf:
            - {properties: {status: {const: passed}, code: {const: ok}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: failed}, code: {const: invalid_format}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unsupported}, code: {const: unsupported_protocol}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unsupported}, code: {const: unsupported_transport}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
    TCPCheck:
      allOf:
        - { $ref: '#/components/schemas/Check' }
        - oneOf:
            - {properties: {status: {const: failed}, code: {const: invalid_format}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: failed}, code: {const: dns_failed}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: failed}, code: {const: connect_failed}, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: blocked}, code: {const: unsafe_target}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unsupported}, code: {const: unsupported_protocol}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unsupported}, code: {const: unsupported_transport}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: skipped}, code: {const: prerequisite_failed}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: passed}, code: {const: ok}, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: timeout}, code: {const: deadline}, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: cancelled}, code: {const: cancelled}, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
    ProxyCheck:
