            - {properties: {status: {const: blocked}, code: {const: region_blocked}, latencyMs: false, bytes: false, bytesPerSecond: false, retryAfterSeconds: false, region: false, httpStatus: {not: {const: 429}}}}
            - {properties: {status: {const: failed}, code: {const: request_failed}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: timeout}, code: {const: deadline}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: cancelled}, code: {const: cancelled}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unsupported}, code: {const: probe_inconclusive}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
    Checks:
      type: object
      additionalProperties: false
      properties:
        format: { $ref: '#/components/schemas/FormatCheck' }
        tcp: { $ref: '#/components/schemas/TCPCheck' }
        proxy: { $ref: '#/components/schemas/ProxyCheck' }
        speed: { $ref: '#/components/schemas/SpeedCheck' }
        observations:
          allOf:
            - { $ref: '#/components/schemas/Check' }
            - required: [report]
              properties:
                status: { not: { const: passed } }
                report: { $ref: '#/components/schemas/ObservationReport' }
        unlock:
          allOf:
            - { $ref: '#/components/schemas/UnlockCheck' }
            - if: { properties: { status: { const: unknown } } }
              then: { required: [services] }
            - properties:
                services:
                  type: array
                  maxItems: 8
                  items:
                    allOf:
                      - { $ref: '#/components/schemas/ServiceCheck' }
                      - required: [service]
                        properties:
                          service: { $ref: '#/components/schemas/Service' }
                          checkedAt: { type: string, format: date-time, description: Independent provider completion time; absent for older detectors. Never inferred from task delivery. }
    ObservationReport:
      type: object
      required: [version, requestId, scope, results]
      properties:
        version: { type: integer, const: 1 }
        requestId: { type: string, description: Must equal the leased task ID. }
        scope: { const: node }
        checkedAt: { type: string, format: date-time, readOnly: true }
        expiresAt: { type: string, format: date-time, readOnly: true, description: Ten-minute display freshness; not a cache guarantee. }
        results: { type: array, minItems: 1, maxItems: 6, items: { $ref: '#/components/schemas/Observation' } }
        conflicts:
          type: array
          readOnly: true
          description: Recomputed from independent results; IPv4 and IPv6 are separate; countries compared only for the same IP. No majority winner.
          items:
            type: object
            properties:
              type: { enum: [ip, country] }
              family: { type: integer, enum: [4, 6] }
              ip: { type: string }
              values: { type: array, items: { type: string } }
    Observation:
      type: object
      required: [source, kind, status, error, checkedAt, durationMs, probeVersion, ip, family, countryCode, asn, riskScore, isResidential, isBroadcast, latencyMs, measurement, httpStatus, retryAfterSeconds]
      properties:
        source: { $ref: '#/components/schemas/ObservationSource' }
        kind: { enum: [exit, quality] }
        status: { enum: [ok, partial, unknown, unsupported, not_configured, timeout, cancelled, rate_limited, challenge, error] }
        error: { type: [string, 'null'], enum: [null, transport_unavailable, token_required, timeout, cancelled, rate_limited, challenge, network_error, http_error, redirect_rejected, response_too_large, invalid_response, no_availability_evidence] }
        checkedAt: { type: string, format: date-time }
        durationMs: { type: number, minimum: 0, maximum: 30000, description: Source request duration including limiter wait; never node latency. }
        probeVersion: { const: '1' }
        ip: { type: [string, 'null'] }
        family: { enum: [4, 6, null] }
        countryCode: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
        asn: { type: [integer, 'null'], minimum: 0, maximum: 4294967295 }
        riskScore: { type: [number, 'null'], minimum: 0, maximum: 100, description: IPPure fraudScore only; missing/invalid stays null, never averaged. }
        isResidential: { type: [boolean, 'null'] }
        isBroadcast: { type: [boolean, 'null'] }
        latencyMs: { type: 'null' }
        measurement: { type: 'null' }
        httpStatus: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        retryAfterSeconds: { type: [integer, 'null'], minimum: 0, maximum: 86400, description: Provider 429 or local limiter. Local cooldown has null httpStatus. }
