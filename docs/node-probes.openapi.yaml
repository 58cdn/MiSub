            - {properties: {status: {const: unknown}, code: {const: probe_inconclusive}, retryAfterSeconds: false, region: false, httpStatus: {const: 200}, bytes: {maximum: 65535}}}
            - {properties: {status: {const: unknown}, code: {const: rate_limited}, latencyMs: false, bytes: false, bytesPerSecond: false, region: false, httpStatus: {const: 429}}, required: [httpStatus]}
    UnlockCheck:
      allOf:
        - { $ref: '#/components/schemas/Check' }
        - oneOf:
            - {properties: {status: {const: failed}, code: {const: invalid_format}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: failed}, code: {const: dns_failed}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: blocked}, code: {const: unsafe_target}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unsupported}, code: {const: unsupported_protocol}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unsupported}, code: {const: unsupported_transport}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unsupported}, code: {const: kernel_missing}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unsupported}, code: {const: kernel_failed}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unsupported}, code: {const: cancelled}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: skipped}, code: {const: prerequisite_failed}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: unknown}, code: {const: probe_inconclusive}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
            - {properties: {status: {const: cancelled}, code: {const: cancelled}, latencyMs: false, bytes: false, bytesPerSecond: false, httpStatus: false, retryAfterSeconds: false, region: false}}
    ServiceCheck:
      allOf:
        - { $ref: '#/components/schemas/Check' }
        - oneOf:
            - {properties: {status: {const: unknown}, code: {const: probe_inconclusive}, latencyMs: false, bytes: false, bytesPerSecond: false, retryAfterSeconds: false, region: false, httpStatus: {not: {const: 429}}}}
            - {properties: {status: {const: unknown}, code: {const: service_reachable}, latencyMs: false, bytes: false, bytesPerSecond: false, retryAfterSeconds: false, region: false, httpStatus: {anyOf: [{minimum: 200, maximum: 299}, {const: 401}]}}, allOf: [{if: {required: [httpStatus], properties: {httpStatus: {const: 401}}}, then: {properties: {service: {const: openai}}}}]}
