<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Probe execution history fixture</title>
    </head>
    <body class="bg-gray-50 p-2 text-gray-900 md:p-6 dark:bg-gray-950 dark:text-gray-100">
        <div id="app"></div>
        <script type="module">
            import { createApp, h, ref } from 'vue';
            import DetectorSettings from '/src/components/settings/sections/DetectorSettings.vue';
            import NodeDetectionPanel from '/src/components/nodes/NodeDetectionPanel.vue';
            import { setLocale } from '/src/i18n/index.js';
            import '/src/assets/main.css';

            const params = new URLSearchParams(location.search);
            const locale = params.get('locale') || 'en-US';
            document.documentElement.lang = locale;
            document.documentElement.classList.toggle('dark', params.get('theme') === 'dark');
            setLocale(locale);
            createApp({
                setup() {
                    const view = ref(params.get('view') || 'history');
                    const node = {
                        id: 'fixture-node',
                        name: 'Local format fixture',
                        url: 'ss://fixture-only@example.invalid:443',
                    };
                    return () =>
                        h('main', { class: 'mx-auto min-w-0 max-w-6xl' }, [
                            h(
                                'nav',
                                {
                                    class: 'mb-4 flex flex-wrap gap-2',
                                    'aria-label': 'Fixture views',
                                },
                                ['history', 'nodes'].map((name) =>
                                    h(
                                        'button',
                                        {
                                            type: 'button',
                                            class: 'min-h-11 rounded border border-gray-400 px-3',
                                            'data-testid': `fixture-view-${name}`,
                                            'aria-pressed': view.value === name,
                                            onClick: () => {
                                                view.value = name;
                                            },
                                        },
                                        name === 'history' ? 'Detector history' : 'Node results'
                                    )
                                )
                            ),
                            view.value === 'history'
                                ? h(DetectorSettings)
                                : h(NodeDetectionPanel, {
                                      embedded: true,
                                      nodes: [node],
                                      selectedNodeIds: new Set([node.id]),
                                  }),
                        ]);
                },
            }).mount('#app');
        </script>
    </body>
</html>
