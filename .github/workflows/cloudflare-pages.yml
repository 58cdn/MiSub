name: Cloudflare Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provision_node_probes:
        description: Explicitly provision missing probe D1 (production resource change)
        type: boolean
        default: false
      accept_node_probes:
        description: Run production smoke that creates and revokes temporary detector identities
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check deployment script syntax
        run: |
          bash -n scripts/deploy-cloudflare-pages.sh
          bash -n scripts/provision-probe-d1.sh
          node --check scripts/smoke-node-probes.mjs
          node --check scripts/probe-acceptance-candidate.mjs

      - name: Test deployment scripts (offline)
        run: node --test tests/deployment/*.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          TEST_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:ci

      - name: Retain Vitest discovery and completion summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-summary
          path: tmp/test-gates/vitest-summary.json
          if-no-files-found: error

      - name: Build Pages assets
        run: npm run build

      - name: Set up Go for production acceptance
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.accept_node_probes
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build real detector for production acceptance
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.accept_node_probes
        run: node scripts/probe-acceptance-candidate.mjs

      # PRs from forks must never receive production credentials.
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.CLOUDFLARE_D1_DATABASE_NAME }}
          PROVISION_NODE_PROBES: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.provision_node_probes }}
        run: bash scripts/deploy-cloudflare-pages.sh

      - name: Accept deployed two-detector task loop
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.accept_node_probes
        env:
          RUN_NODE_PROBE_ACCEPTANCE: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: node scripts/smoke-node-probes.mjs

  acceptance-candidate:
    name: Build acceptance candidate without production access
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build and identify the checked-out candidate without production access
        run: node scripts/probe-acceptance-candidate.mjs
