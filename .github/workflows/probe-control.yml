name: Probe control plane
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  TEST_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test acceptance gate failure boundaries
        run: node --test tests/gates/*.test.mjs
      - name: Test every registered HTTP and SQLite entry
        run: node scripts/test-gates/node.mjs
      - name: Retain Node completion summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-node-summary
          path: tmp/test-gates/node-summary.json
          if-no-files-found: error
  browser-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare Chromium for isolated browser fixtures
        run: npx playwright install --with-deps chromium
      - name: Check every registered browser entry against mock APIs
        run: node scripts/test-gates/browser.mjs
      - name: Retain browser completion summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-browser-summary
          path: tmp/test-gates/browser-summary.json
          if-no-files-found: error
