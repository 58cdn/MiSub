name: CONNECT executor
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    offline-transport:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
            - name: Verify real CONNECT transport using local fixtures only
              run: node --test tests/executor/*.check.mjs
