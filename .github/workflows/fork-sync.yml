name: Fork Sync

on:
  schedule:
    - cron: "0 22 * * *"     # 每天北京时间 06:00 执行
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT != '' && secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Configure Git and remotes
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          git config user.name "tdou@ChatGPT"
          git config user.email "tdou@chatgpt.com"

          git checkout main || git checkout -b main

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/imzyb/MiSub.git
          else
            git remote add upstream https://github.com/imzyb/MiSub.git
          fi

          if [ -n "${SYNC_PAT:-}" ]; then
            git remote set-url origin "https://x-access-token:${SYNC_PAT}@github.com/${{ github.repository }}.git"
            echo "✅ 检测到 SYNC_PAT，将使用 PAT 推送（支持同步 .github/workflows）。"
          else
            echo "⚠️ 未配置 SYNC_PAT，将使用默认 GITHUB_TOKEN。"
          fi

          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Fast-forward upstream without overwriting fork commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ORIGIN_SHA="$(git rev-parse origin/main)"
          UPSTREAM_SHA="$(git rev-parse upstream/main)"

          if [ "$ORIGIN_SHA" = "$UPSTREAM_SHA" ]; then
            echo "✨ Fork 已与上游一致。"
            exit 0
          fi

          # The fork may contain its own Actions/configuration: never reset or force-push.
          if ! git merge-base --is-ancestor "$ORIGIN_SHA" "$UPSTREAM_SHA"; then
            echo "::notice title=Fork Sync skipped::检测到 fork 有独立提交；不进行强制镜像，以免覆盖 CI/CD 配置。可由 sync-upstream workflow 尝试普通合并。"
            exit 0
          fi

          git merge --ff-only upstream/main
          git push origin main
          echo "✅ 已安全快进至上游 main。"
          gh workflow run cloudflare-pages.yml --ref main
